# Local: puedes usar el mismo .env que InfinityFree; DB_* del contenedor web apunta al servicio `db`.
# Contraseña MySQL local: LOCAL_DB_PASSWORD en .env o .env.local (Compose lee .env para ${...}), o el default.
services:
  web:
    build: .
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: liga_padel
      DB_USER: admin_padel
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-cambiar_en_local}
      DB_CHARSET: utf8mb4
    depends_on:
      - db

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cambiar_root_en_local}
      MYSQL_DATABASE: liga_padel
      MYSQL_USER: admin_padel
      MYSQL_PASSWORD: ${LOCAL_DB_PASSWORD:-cambiar_en_local}
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/liga_padel_init.sql:/docker-entrypoint-initdb.d/01-liga_padel.sql:ro

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data:
