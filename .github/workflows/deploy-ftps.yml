# Despliegue a hosting FTP/FTPS (p. ej. InfinityFree).
# GitHub → Settings → Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# Opcional: FTP_SERVER_DIR (ej. /htdocs)
#
# El .env y includes/env.php NO se suben: créalos solo en el hosting (copia desde *.example).

name: Deploy FTPS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository != ''
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/htdocs/' }}
          exclude: |
            **/.git*
            **/.github/**
            **/.env
            **/.env.*
            !**/.env.example
            !**/.env.staging.example
            **/includes/env.php
            **/uploads/**
            !**/uploads/.htaccess
            **/config/mail.local.php
            **/tests/**
            **/docker-compose*.yml
            **/Dockerfile
            **/backup*.sql
            **/dumps/**
