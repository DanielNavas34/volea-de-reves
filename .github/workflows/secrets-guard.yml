name: Secrets guard

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  no-secrets-in-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if .env or mail.local committed
        run: |
          set -e
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env no debe estar en el repositorio"
            exit 1
          fi
          if git ls-files | grep -q '^config/mail\.local\.php$'; then
            echo "::error::config/mail.local.php no debe estar en el repositorio"
            exit 1
          fi
          if git grep -E 'MAIL_PASSWORD\s*=\s*[^$\s]' -- '.env.example' ':!*.example' 2>/dev/null; then
            echo "::warning::Revisa que no haya contraseñas reales en archivos trackeados"
          fi
          echo "OK: archivos sensibles no trackeados"
